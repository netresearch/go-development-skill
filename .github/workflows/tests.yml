name: Skill Tests

# Runs this repo's behavioural tests (tests/*.sh) via the skill-repo-skill
# reusable: the shipped skills/go-development/scripts/verify-go-project.sh,
# Build/Scripts/check-plugin-version.sh and the pre-push hook. The other
# workflows validate structure, lint and security; none of them executes a
# script. Not part of the central skill template, so it carries its own notice.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    uses: netresearch/skill-repo-skill/.github/workflows/tests.yml@main
    permissions:
      contents: read
    with:
      require_tests: true
